name: Update one AUR package

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      version:
        type: string
        required: true
      dry_run:
        type: boolean
        required: true
    secrets:
      aur_ssh_key:
        required: false

permissions:
  contents: read

concurrency:
  group: aur-update-${{ inputs.package }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      patch: ${{ steps.bump.outputs.patch }}
      base: ${{ steps.bump.outputs.base }}
      version: ${{ steps.bump.outputs.version }}
    env:
      PACKAGE: ${{ inputs.package }}
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Install Arch tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed ca-certificates git pacman-contrib python sudo

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare update
        id: bump
        run: |
          build="$(python scripts/packages.py build "$PACKAGE")"

          useradd --create-home aur-builder
          printf '%s\n' 'aur-builder ALL=(root) NOPASSWD: /usr/bin/pacman' |
            install -D -m 0440 /dev/stdin /etc/sudoers.d/aur-builder
          runuser --user aur-builder -- bash scripts/prepare.sh "$PACKAGE" "$VERSION" "$build" "$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Summarize
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BASE: ${{ steps.bump.outputs.base }}
        run: |
          printf '### %s %s\n\n' "$PACKAGE" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$BASE" ]]; then
            printf 'No version bump needed.\n' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$DRY_RUN" == true ]]; then
            printf 'Update prepared in dry-run mode.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Update prepared for AUR publication.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: prepare
    if: ${{ !inputs.dry_run && github.ref_name == github.event.repository.default_branch && needs.prepare.outputs.patch != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Push update to AUR
        id: aur
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BASE: ${{ needs.prepare.outputs.base }}
          AUR_PATCH: ${{ needs.prepare.outputs.patch }}
          AUR_SSH_KEY: ${{ secrets.aur_ssh_key }}
        run: bash scripts/publish.sh

      - name: Record published AUR version on GitHub
        env:
          PACKAGE: ${{ inputs.package }}
          AUR_VERSION: ${{ steps.aur.outputs.aur_version }}
        run: |
          : "${AUR_VERSION:?Missing published AUR version}"
          printf '%s\n' "$AUR_VERSION" > "packages/$PACKAGE/aur-version"
          git add -- "packages/$PACKAGE/aur-version"
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record $PACKAGE $AUR_VERSION"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo 'Published to AUR but failed to update the version record on GitHub.' >&2
          exit 1
